# Deploy to Proxmox LXC via SSH (boule-score pattern).
#
# Runs deploy in `docker run --network host` so the LXC is reachable on the
# runner host network without WireGuard inside the job. DEPLOY_WG_CONF is only
# a fallback if the host is unreachable.
#
# Required secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_DIR
# Optional: DEPLOY_USER, DEPLOY_WG_CONF, DEPLOY_SERVICE, DEPLOY_BRANCH,
#           DEPLOY_SSH_PORT, DEPLOY_HEALTH_*, DEPLOY_SSH_KNOWN_HOSTS
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy was triggered
        required: false
        default: manual

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke tests
        run: |
          python3 test_db_goals.py
          python3 test_advisor.py
          python3 test_parser.py

      - name: Deploy to LXC
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_WG_CONF: ${{ secrets.DEPLOY_WG_CONF }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_HEALTH_RETRIES: ${{ secrets.DEPLOY_HEALTH_RETRIES }}
          DEPLOY_HEALTH_INTERVAL: ${{ secrets.DEPLOY_HEALTH_INTERVAL }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash scripts/ci-deploy-hostnet.sh
