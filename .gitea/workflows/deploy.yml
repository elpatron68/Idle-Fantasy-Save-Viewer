# Deploy to Proxmox LXC over WireGuard.
#
# All parameters come from Gitea repository Secrets (Settings → Secrets).
# Required: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_DIR, DEPLOY_WG_CONF
# Optional: DEPLOY_SERVICE, DEPLOY_BRANCH, DEPLOY_SSH_PORT,
#           DEPLOY_HEALTH_RETRIES, DEPLOY_HEALTH_INTERVAL, DEPLOY_SSH_KNOWN_HOSTS
#
# Runner must expose /dev/net/tun + CAP_NET_ADMIN to job containers
# (see scripts/setup-gitea-runner.sh).
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy was triggered
        required: false
        default: manual

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WireGuard tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools openssh-client

      - name: Smoke tests
        run: |
          python3 test_db_goals.py
          python3 test_advisor.py
          python3 test_parser.py

      - name: Deploy over WireGuard
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_WG_CONF: ${{ secrets.DEPLOY_WG_CONF }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_HEALTH_RETRIES: ${{ secrets.DEPLOY_HEALTH_RETRIES }}
          DEPLOY_HEALTH_INTERVAL: ${{ secrets.DEPLOY_HEALTH_INTERVAL }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-ci.sh
