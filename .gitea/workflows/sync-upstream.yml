# Sync vendored recipe JSON from tristinbaker/IdleFantasy, run smoke tests,
# then deploy when game_data changed (same host-network SSH pattern as Deploy).
#
# Secrets: see README "Gitea deploy secrets"
# Optional: AUTO_DEPLOY=false to skip deploy after sync
name: Sync Upstream Game Data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was triggered
        required: false
        default: manual

jobs:
  sync-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync recipe JSON from upstream IdleFantasy
        run: python3 scripts/sync_game_data.py

      - name: Smoke tests
        run: |
          python3 test_db_goals.py
          python3 test_advisor.py
          python3 test_parser.py

      - name: Commit and push if game_data changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "game_data already current"
            exit 0
          fi
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@users.noreply.local"
          git add game_data/
          git commit -m "Sync game_data from tristinbaker/IdleFantasy (automated)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        if: steps.commit.outputs.changed == 'true'
        env:
          AUTO_DEPLOY: ${{ secrets.AUTO_DEPLOY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_WG_CONF: ${{ secrets.DEPLOY_WG_CONF }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_HEALTH_RETRIES: ${{ secrets.DEPLOY_HEALTH_RETRIES }}
          DEPLOY_HEALTH_INTERVAL: ${{ secrets.DEPLOY_HEALTH_INTERVAL }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [[ "${AUTO_DEPLOY:-}" == "false" ]]; then
            echo "AUTO_DEPLOY=false — skipping deploy"
            exit 0
          fi
          bash scripts/ci-deploy-hostnet.sh
