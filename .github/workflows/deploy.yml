# Deploy to Proxmox LXC over WireGuard from GitHub-hosted runners.
#
# GitHub-hosted VMs are not on the LAN, so host-network SSH cannot reach the
# LXC. The job brings up WireGuard, SSHs to DEPLOY_HOST, then tears the tunnel
# down. Requires /dev/net/tun (present on ubuntu-latest) and sudo.
#
# Required secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_DIR, DEPLOY_WG_CONF
# Optional: DEPLOY_USER, DEPLOY_SERVICE, DEPLOY_BRANCH, DEPLOY_SSH_PORT,
#           DEPLOY_HEALTH_*, DEPLOY_SSH_KNOWN_HOSTS, DEPLOY_GIT_REMOTE
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy was triggered
        required: false
        default: manual

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke tests
        run: |
          python3 test_db_goals.py
          python3 test_advisor.py
          python3 test_parser.py
          python3 -c "import app"

      - name: Install WireGuard tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iproute2 openssh-client

      - name: Deploy to LXC over WireGuard
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_WG_CONF: ${{ secrets.DEPLOY_WG_CONF }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_HEALTH_RETRIES: ${{ secrets.DEPLOY_HEALTH_RETRIES }}
          DEPLOY_HEALTH_INTERVAL: ${{ secrets.DEPLOY_HEALTH_INTERVAL }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_GIT_REMOTE: ${{ secrets.DEPLOY_GIT_REMOTE }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          sudo -E env \
            DEPLOY_SSH_KEY="$DEPLOY_SSH_KEY" \
            DEPLOY_HOST="$DEPLOY_HOST" \
            DEPLOY_DIR="$DEPLOY_DIR" \
            DEPLOY_USER="$DEPLOY_USER" \
            DEPLOY_WG_CONF="$DEPLOY_WG_CONF" \
            DEPLOY_SERVICE="$DEPLOY_SERVICE" \
            DEPLOY_BRANCH="$DEPLOY_BRANCH" \
            DEPLOY_SSH_PORT="$DEPLOY_SSH_PORT" \
            DEPLOY_HEALTH_RETRIES="$DEPLOY_HEALTH_RETRIES" \
            DEPLOY_HEALTH_INTERVAL="$DEPLOY_HEALTH_INTERVAL" \
            DEPLOY_SSH_KNOWN_HOSTS="$DEPLOY_SSH_KNOWN_HOSTS" \
            DEPLOY_GIT_REMOTE="$DEPLOY_GIT_REMOTE" \
            EXPECTED_SHA="$EXPECTED_SHA" \
            bash scripts/deploy-ci.sh
