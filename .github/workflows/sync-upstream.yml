# Sync vendored recipe JSON, then deploy over WireGuard when game_data changed.
# GitHub-hosted runners need WireGuard to reach the Proxmox LXC (not on the LAN).
name: Sync Upstream Game Data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was triggered
        required: false
        default: manual
  repository_dispatch:
    types: [idle-fantasy-upstream-updated]

permissions:
  contents: write

jobs:
  sync-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync recipe JSON from upstream IdleFantasy
        run: python scripts/sync_game_data.py

      - name: Smoke tests
        run: |
          python test_db_goals.py
          python test_advisor.py
          python test_parser.py

      - name: Commit and push if game_data changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_data/
          git commit -m "Sync game_data from tristinbaker/IdleFantasy"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install WireGuard tools
        if: steps.commit.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iproute2 openssh-client

      - name: Deploy to production over WireGuard
        if: steps.commit.outputs.changed == 'true'
        env:
          AUTO_DEPLOY: ${{ secrets.AUTO_DEPLOY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_WG_CONF: ${{ secrets.DEPLOY_WG_CONF }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_HEALTH_RETRIES: ${{ secrets.DEPLOY_HEALTH_RETRIES }}
          DEPLOY_HEALTH_INTERVAL: ${{ secrets.DEPLOY_HEALTH_INTERVAL }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_GIT_REMOTE: ${{ secrets.DEPLOY_GIT_REMOTE }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [[ "${AUTO_DEPLOY:-}" == "false" ]]; then
            echo "AUTO_DEPLOY=false — skipping deploy"
            exit 0
          fi
          sudo -E env \
            DEPLOY_SSH_KEY="$DEPLOY_SSH_KEY" \
            DEPLOY_HOST="$DEPLOY_HOST" \
            DEPLOY_DIR="$DEPLOY_DIR" \
            DEPLOY_USER="$DEPLOY_USER" \
            DEPLOY_WG_CONF="$DEPLOY_WG_CONF" \
            DEPLOY_SERVICE="$DEPLOY_SERVICE" \
            DEPLOY_BRANCH="$DEPLOY_BRANCH" \
            DEPLOY_SSH_PORT="$DEPLOY_SSH_PORT" \
            DEPLOY_HEALTH_RETRIES="$DEPLOY_HEALTH_RETRIES" \
            DEPLOY_HEALTH_INTERVAL="$DEPLOY_HEALTH_INTERVAL" \
            DEPLOY_SSH_KNOWN_HOSTS="$DEPLOY_SSH_KNOWN_HOSTS" \
            DEPLOY_GIT_REMOTE="$DEPLOY_GIT_REMOTE" \
            EXPECTED_SHA="$EXPECTED_SHA" \
            bash scripts/deploy-ci.sh
